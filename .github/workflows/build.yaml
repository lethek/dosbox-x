---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "DOSBox-X image"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["Dockerfile", "start.sh", ".github/workflows/**"]

env:
  IMAGE: ghcr.io/lethek/dosbox-x

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: echo "dosbox_x=$(sed -n 's/^ARG DOSBOX_X_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.dosbox_x }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.dosbox_x }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
