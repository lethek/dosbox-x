---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Images"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["base/**", "novnc/**", ".github/workflows/**"]

env:
  BASE_IMAGE: ghcr.io/lethek/dosbox-x
  NOVNC_IMAGE: ghcr.io/lethek/dosbox-x-novnc

jobs:
  base:
    name: dosbox-x
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.dosbox_x }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: echo "dosbox_x=$(sed -n 's/^ARG DOSBOX_X_VERSION=//p' base/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: base
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:${{ steps.version.outputs.dosbox_x }}
            ${{ env.BASE_IMAGE }}:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  novnc:
    name: dosbox-x-novnc
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: novnc
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ needs.base.outputs.version }}
          tags: |
            ${{ env.NOVNC_IMAGE }}:${{ needs.base.outputs.version }}
            ${{ env.NOVNC_IMAGE }}:latest
          cache-from: type=gha,scope=novnc
          cache-to: type=gha,mode=max,scope=novnc
